name: Slot Lab backend preview
on:
  push:
    branches: [main]
    paths:
      - 'slot-lab/**'
      - '.github/workflows/slot-lab-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: slot-lab-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: slot-lab/package-lock.json
      - run: npm ci
        working-directory: slot-lab
      - run: npm run build
        working-directory: slot-lab
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slot-lab/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
